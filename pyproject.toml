[project]
name = "django-shortify"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django[argon2]>=6.0.7,<6.1.0",
    "django-stubs-ext>=6.0.7,<6.1.0",
    "django-split-settings>=1.3.2,<1.4.0",
    "django-cors-headers>=4.9.0,<5.0.0",
    "django-modern-rest[attrs,jwt,msgspec,openapi]>=0.11.0,<0.12.0",
    "python-decouple>=3.8,<4.0",
    "punq>=0.8.0,<1.0",
]

[dependency-groups]
dev = [
  # lint and type-check
  "mypy>=2.3.0",
  "ruff>=0.16.0",
  # test tools
  "pytest>=9.1.1",
  "pytest-django>=4.12.0",
  # django stuff
  "ipython>=9.15.0",
  "django-debug-toolbar>=7.0.0",
  "django-zeal>=2.2.2",
  "django-stubs[compatible-mypy]>=6.0.7,<6.1.0",
]
